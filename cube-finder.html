<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Cube Finder — KKK Timer 3.0</title>
  <meta name="description" content="Answer three questions and get a specific speedcube recommendation for your budget, puzzle type, and turning style. Based on 2026 cube reviews for 2x2, 3x3, 4x4, 5x5, 6x6, 7x7, and Skewb.">
  <link rel="canonical" href="https://krameshece-ctrl.github.io/KKK-TIMER-3.0/cube-finder.html">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    a { color: #10b981; }
    h2 { color: #10b981; }
    .q-card { background: #0f0f13; border: 1px solid #1f1f23; border-radius: 12px; padding: 18px; margin-bottom: 12px; }
    .opt-btn { background: #1a1a1f; border: 1px solid #2a2a2f; color: #d4d4d8; padding: 12px; border-radius: 8px; cursor: pointer; transition: all 0.15s; text-align: left; width: 100%; }
    .opt-btn:hover { border-color: #10b981; background: #1a2a1f; }
    .opt-btn.selected { border-color: #10b981; background: rgba(16,185,129,0.15); color: #fff; }
    .result-card { background: #0f0f13; border: 1px solid #10b981; border-radius: 12px; padding: 20px; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-200 p-6 max-w-2xl mx-auto leading-relaxed">

  <nav class="mb-8 text-sm">
    <a href="/KKK-TIMER-3.0/">← Back to timer</a>
  </nav>

  <h1 class="text-3xl sm:text-4xl font-black mb-2">Cube Finder</h1>
  <p class="text-zinc-400 mb-8 text-sm">Three questions. One specific recommendation. Based on 2026 cube reviews.</p>

  <div id="finder">
    <!-- Q1: Puzzle type -->
    <div class="q-card" data-q="type">
      <h2 class="font-bold mb-3">1. What puzzle type?</h2>
      <div class="grid grid-cols-2 gap-2">
        <button class="opt-btn" data-val="2x2">2×2</button>
        <button class="opt-btn" data-val="3x3">3×3</button>
        <button class="opt-btn" data-val="4x4">4×4</button>
        <button class="opt-btn" data-val="5x5">5×5</button>
        <button class="opt-btn" data-val="6x6">6×6</button>
        <button class="opt-btn" data-val="7x7">7×7</button>
        <button class="opt-btn" data-val="skewb">Skewb</button>
      </div>
    </div>

    <!-- Q2: Budget -->
    <div class="q-card" data-q="budget">
      <h2 class="font-bold mb-3">2. What is your budget?</h2>
      <div class="space-y-2">
        <button class="opt-btn" data-val="budget">Budget — under $20 / ₹1000</button>
        <button class="opt-btn" data-val="mid">Mid — $20–40 / ₹1000–3000</button>
        <button class="opt-btn" data-val="premium">Premium — $40+ / ₹3000+</button>
      </div>
    </div>

    <!-- Q3: Priority -->
    <div class="q-card" data-q="priority">
      <h2 class="font-bold mb-3">3. What do you want more?</h2>
      <div class="space-y-2">
        <button class="opt-btn" data-val="speed">Speed — fast, snappy, responsive</button>
        <button class="opt-btn" data-val="control">Control — stable, predictable, locked-in</button>
      </div>
    </div>

    <button id="find-btn" class="w-full mt-4 py-3 rounded-xl text-white font-bold text-base" style="background:#10b981;" disabled>
      Find My Cube
    </button>
  </div>

  <div id="result" class="hidden"></div>

  <hr class="my-10 border-zinc-800">

  <nav class="text-sm flex flex-wrap gap-4">
    <a href="/KKK-TIMER-3.0/">← Timer</a>
    <a href="/KKK-TIMER-3.0/faq.html">FAQ</a>
    <a href="/KKK-TIMER-3.0/help.html">Help</a>
  </nav>

  <script>

      '3x3-budget-control': {

      },
      '3x3-premium-control': {
        name: 'GAN 16 MagLev MAX',
        desc: 'A versatile flagship with extensive tuning across tension, center travel, magnet rods, and edge magnets. Top speedcubers use it with custom setups. It offers a balance of speed, stability, and feedback rather than pushing any single trait to the extreme. It is a strong choice if you want a premium cube you can tune toward control [citation:8].'

      // ===== 2x2 =====
      '2x2-budget-speed': {

      },

        desc: 'The best budget magnetic 6×6 in 2026. Reviews say it is comfortably ahead of the MeiLong V2 M, with a compact 60.5mm size, UV coating, and magnetic positioning. It is exceptional value for money — many speedcubers may have little reason to consider a more expensive 6×6 [citation:4].'

      '6x6-budget-control': {

        desc: 'A budget-friendly 6×6 with a slightly bubbly feel and good stability. It measures approximately 63mm, making it slightly larger than the Warrior. Reviews say solving performance is remarkably similar to the Warrior, but the M Pro costs a bit more. It is a good choice if you prefer a slightly larger cube [citation:4].'

      },
      '6x6-mid-control': {
        name: 'X-Man Shadow V3 M',

      // ===== 7x7 =====
      '7x7-budget-speed': {
        name: 'YJ YuFu V2M',

      // ===== Skewb =====
      'skewb-budget-speed': {
        name: 'MoYu RS Skewb M',
        desc: 'A budget Skewb that is widely recommended for beginners. Reviews describe it as cheap, nice-feeling, and easy to set up. It is the best price-to-performance ratio in Skewb. If you are just getting into Skewb and do not want to spend much, the RS Skewb is the safe choice [citation:24].'
      },
      'skewb-budget-control': {
        name: 'MoYu RS Skewb M',
        desc: 'The same budget Skewb, recommended for its controllable feel. Reviews say it is a good option for those just starting out. It is not the fastest or most refined Skewb, but it is predictable and affordable. A solid choice if you want to try Skewb without committing to a premium cube [citation:24].'
      },
      'skewb-mid-speed': {
        name: 'GAN Skewb M',

      },
      'skewb-mid-control': {
        name: 'GAN Skewb M Enhanced',

      },
      'skewb-premium-speed': {
        name: 'GAN Skewb M Enhanced UV',
        desc: 'The premium GAN Skewb with UV coating. Reviews say it is far superior in performance, fast and fluid. The UV coating adds grip. Some note it is harder to hold than the DaYan, but for pure speed and refinement, the GAN Enhanced UV is the top choice [citation:16][citation:24].'
      },
      'skewb-premium-control': {
        name: 'GAN Skewb M Enhanced UV',
        desc: 'The same premium Skewb, highlighted for its control. Reviews describe it as stable and reliable, with less lock-up than the DaYan. It is the most reliable Skewb in competition. If you want a premium Skewb that will not let you down under pressure, this is the one [citation:24].'
      }
    };

    function updateButton() {
      const ready = answers.type && answers.budget && answers.priority;
      document.getElementById('find-btn').disabled = !ready;
    }

    document.querySelectorAll('.q-card').forEach(card => {
      const q = card.dataset.q;
      card.querySelectorAll('.opt-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          card.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          answers[q] = btn.dataset.val;
          updateButton();
        });
      });
    });

    document.getElementById('find-btn').addEventListener('click', () => {
      const key = `${answers.type}-${answers.budget}-${answers.priority}`;
      const rec = RECS[key];
      if (!rec) {
        document.getElementById('result').innerHTML = '<p class="text-red-400">No match found. Please try different options.</p>';
        document.getElementById('result').classList.remove('hidden');
        return;
      }
      document.getElementById('finder').classList.add('hidden');
      document.getElementById('result').innerHTML = `
        <div class="result-card">
          <div class="text-xs text-zinc-400 uppercase font-semibold mb-1">Your recommendation</div>
          <div class="text-2xl font-black text-white mb-3">${rec.name}</div>
          <p class="text-sm text-zinc-300 mb-4 leading-relaxed">${rec.desc}</p>
          <button id="reset-btn" class="w-full py-2 rounded-xl text-zinc-300 text-sm border" style="background:#1a1a1f; border-color:#2a2a2f;">
            Try again
          </button>
          <p class="text-xs text-zinc-500 mt-3">This is a guide based on 2026 reviews, not a guarantee. Your feel may vary. Check current availability at your local cube store.</p>
        </div>
      `;
      document.getElementById('result').classList.remove('hidden');
      document.getElementById('reset-btn').addEventListener('click', () => {
        document.getElementById('result').classList.add('hidden');
        document.getElementById('finder').classList.remove('hidden');
        answers.type = answers.budget = answers.priority = null;
        document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
        document.getElementById('find-btn').disabled = true;
      });
    });
  </script>

</body>
</html>
