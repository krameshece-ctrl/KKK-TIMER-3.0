<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Rate Us — KKK Timer 3.0</title>
  <meta name="description" content="Rate the features of KKK Timer 3.0. Your ratings are saved locally in your browser and shown back to you on the timer page. Honest, personal, no accounts needed.">
  <link rel="canonical" href="https://krameshece-ctrl.github.io/KKK-TIMER-3.0/rate-us.html">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    a { color: #10b981; }
    a:hover { text-decoration: underline; }
    h2 { color: #10b981; }
    .star-btn { transition: transform 0.1s ease, color 0.1s ease; cursor: pointer; }
    .star-btn:hover { transform: scale(1.15); }
    .star { color: #3f3f46; font-size: 28px; user-select: none; }
    .star.active { color: #fbbf24; }
    .feature-row { background: #0f0f13; border: 1px solid #1f1f23; border-radius: 10px; padding: 16px; margin-bottom: 10px; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-200 p-6 max-w-2xl mx-auto leading-relaxed">

  <nav class="mb-8 text-sm">
    <a href="/KKK-TIMER-3.0/">← Back to timer</a>
  </nav>

  <h1 class="text-3xl sm:text-4xl font-black mb-2">Rate KKK Timer 3.0</h1>
  <p class="text-zinc-400 mb-8 text-sm">Rate each feature. Your ratings are saved locally and shown to you on the timer page.</p>

  <div id="rating-summary" class="mb-6 p-4 rounded-xl border border-emerald-800/50 bg-emerald-950/30 hidden">
    <div class="text-sm text-emerald-300 font-semibold mb-1">Your saved rating</div>
    <div id="summary-overall" class="text-2xl font-bold text-white"></div>
    <div id="summary-stars" class="text-yellow-400 text-lg"></div>
    <div id="summary-date" class="text-xs text-zinc-400 mt-1"></div>
  </div>

  <div id="features-container"></div>

  <button id="submit-btn" class="w-full mt-6 py-3 rounded-xl text-white font-bold text-base" style="background:#10b981;">
    Save My Ratings
  </button>

  <button id="clear-btn" class="w-full mt-2 py-2 rounded-xl text-red-300 font-semibold text-sm border border-red-900/50 bg-red-950/30 hidden">
    Clear My Ratings
  </button>

  <p class="text-xs text-zinc-500 mt-4 text-center">
    Your ratings are stored only in your browser. They are not sent to any server.
  </p>

  <hr class="my-10 border-zinc-800">

  <nav class="text-sm flex flex-wrap gap-4">
    <a href="/KKK-TIMER-3.0/">← Timer</a>
    <a href="/KKK-TIMER-3.0/terms.html">Terms</a>
    <a href="/KKK-TIMER-3.0/privacy.html">Privacy</a>
    <a href="/KKK-TIMER-3.0/faq.html">FAQ</a>
  </nav>

  <script>
    const FEATURES = [
      { id: 'timer',        name: 'Timer and controls',       desc: 'Hold-to-start, timing accuracy, stop response' },
      { id: 'statistics',   name: 'Statistics',               desc: 'Ao5, Ao12, Best, Mo3, trend graph' },
      { id: 'sessions',     name: 'Sessions',                 desc: 'Creating, switching, and managing sessions' },
      { id: 'scrambles',    name: 'Scrambles',                desc: 'Quality, length, and variety per puzzle' },
      { id: 'assistant',    name: 'Cube assistant',           desc: 'Advice, scramble analysis, cubing tips' },
      { id: 'music',        name: 'Music',                    desc: '50 focus tracks and turn-off control' },
      { id: 'themes',       name: 'Themes',                   desc: '25 color themes and auto-save' },
      { id: 'sharing',      name: 'Share and export',         desc: 'Sharing sessions to apps and clipboard' }
    ];

    const STORAGE_KEY = 'kkk_ratings_v1';
    const ratings = {};

    function loadRatings() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) return JSON.parse(stored);
      } catch (e) {}
      return null;
    }

    function saveRatings(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function renderFeatures() {
      const container = document.getElementById('features-container');
      container.innerHTML = '';
      FEATURES.forEach(f => {
        const row = document.createElement('div');
        row.className = 'feature-row';
        row.innerHTML = `
          <div class="mb-2">
            <div class="font-semibold text-white text-sm">${f.name}</div>
            <div class="text-xs text-zinc-400">${f.desc}</div>
          </div>
          <div class="flex items-center gap-1" data-feature="${f.id}">
            ${[1,2,3,4,5].map(n => `<span class="star star-btn" data-value="${n}" data-feature="${f.id}">★</span>`).join('')}
            <span class="text-xs text-zinc-400 ml-2 value-label" data-feature="${f.id}">Not rated</span>
          </div>
        `;
        container.appendChild(row);
      });

      container.querySelectorAll('.star-btn').forEach(star => {
        star.addEventListener('click', () => {
          const featureId = star.dataset.feature;
          const value = parseInt(star.dataset.value);
          setRating(featureId, value);
        });
      });
    }

    function setRating(featureId, value) {
      ratings[featureId] = value;
      updateStars(featureId, value);
    }

    function updateStars(featureId, value) {
      const container = document.querySelector(`[data-feature="${featureId}"][data-feature]`);
      const stars = document.querySelectorAll(`.star-btn[data-feature="${featureId}"]`);
      stars.forEach(s => {
        const n = parseInt(s.dataset.value);
        s.classList.toggle('active', n <= value);
      });
      const label = document.querySelector(`.value-label[data-feature="${featureId}"]`);
      if (label) label.textContent = `${value} / 5`;
    }

    function renderSummary(saved) {
      const summaryBox = document.getElementById('rating-summary');
      const overall = document.getElementById('summary-overall');
      const stars = document.getElementById('summary-stars');
      const date = document.getElementById('summary-date');

      const values = Object.values(saved.ratings);
      if (values.length === 0) {
        summaryBox.classList.add('hidden');
        return;
      }
      const avg = values.reduce((a, b) => a + b, 0) / values.length;
      const rounded = Math.round(avg * 10) / 10;
      overall.textContent = `${rounded.toFixed(1)} / 5`;
      stars.textContent = '★'.repeat(Math.round(avg)) + '☆'.repeat(5 - Math.round(avg));
      const d = new Date(saved.savedAt);
      date.textContent = `Saved on ${d.toLocaleDateString()}`;
      summaryBox.classList.remove('hidden');

      const clearBtn = document.getElementById('clear-btn');
      clearBtn.classList.remove('hidden');
    }

    function handleSubmit() {
      const missing = FEATURES.filter(f => !ratings[f.id]);
      if (missing.length > 0) {
        alert(`Please rate all features before saving.\n\nMissing: ${missing.map(f => f.name).join(', ')}`);
        return;
      }
      const data = {
        ratings: { ...ratings },
        savedAt: Date.now()
      };
      saveRatings(data);
      renderSummary(data);
      alert('Your ratings have been saved! They will now appear on the timer page.');
    }

    function handleClear() {
      if (!confirm('Clear all your saved ratings? This cannot be undone.')) return;
      localStorage.removeItem(STORAGE_KEY);
      FEATURES.forEach(f => {
        delete ratings[f.id];
        const stars = document.querySelectorAll(`.star-btn[data-feature="${f.id}"]`);
        stars.forEach(s => s.classList.remove('active'));
        const label = document.querySelector(`.value-label[data-feature="${f.id}"]`);
        if (label) label.textContent = 'Not rated';
      });
      document.getElementById('rating-summary').classList.add('hidden');
      document.getElementById('clear-btn').classList.add('hidden');
    }

    // INIT
    const saved = loadRatings();
    renderFeatures();
    if (saved && saved.ratings) {
      Object.entries(saved.ratings).forEach(([featureId, value]) => {
        ratings[featureId] = value;
        updateStars(featureId, value);
      });
      renderSummary(saved);
    }

    document.getElementById('submit-btn').addEventListener('click', handleSubmit);
    document.getElementById('clear-btn').addEventListener('click', handleClear);
  </script>

</body>
</html>
